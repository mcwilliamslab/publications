<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Scott R. McWilliams Lab Publications</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 4rem;
      color: #333;
      line-height: 1.6;
      max-width: 900px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #2b4b80;
    }
    .controls {
      margin-bottom: 1.5rem;
    }
    button {
      background-color: #2b4b80;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover {
      background-color: #1f3660;
    }
    .pub-item {
      margin-bottom: 1.5rem;
    }
    a {
      color: #0066cc;
      text-decoration: none;
      display: inline-block;
      max-width: 100%;
      white-space: normal;
      word-wrap: break-word;
    }
    a:hover {
      text-decoration: underline;
    }
    .author {
      display: block;
      margin-top: 0.2rem;
      color: #555;
      font-size: 0.95rem;
    }
    .journal {
      display: block;
      margin-top: 0.1rem;
      color: #777;
      font-style: italic;
      font-size: 0.9rem;
    }
    .download {
      margin-left: 0.5rem;
      font-size: 0.9rem;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #777;
      border-top: 1px solid #eee;
      padding-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>McWilliams Lab Publications</h1>
  <p>Below are research papers made publicly available by the McWilliams Lab. Click the title to view or download.</p>

<div class='controls'>
  <input type='text' id='search' placeholder='Search publications...' style='padding: 0.5rem; width: 60%; max-width: 400px;'>
  <button id='sort-btn'>Sort by Year ↓</button>
</div>

<div class='pub-list' id='pub-list'>
  <!--PUBLICATION_LIST-->
</div>

<script>
  // Simple text search
  document.getElementById('search').addEventListener('input', function() {
    const filter = this.value.toLowerCase();
    const pubs = document.querySelectorAll('.pub-item');
    pubs.forEach(pub => {
      const text = pub.textContent.toLowerCase();
      pub.style.display = text.includes(filter) ? '' : 'none';
    });
  });

  // Sort button toggle
  const sortBtn = document.getElementById('sort-btn');
  let ascending = false;
  sortBtn.addEventListener('click', () => {
    const pubList = document.getElementById('pub-list');
    const items = Array.from(pubList.children);
    items.sort((a, b) => {
      const yearA = parseInt(a.getAttribute('data-year'));
      const yearB = parseInt(b.getAttribute('data-year'));
      return ascending ? yearA - yearB : yearB - yearA;
    });
    items.forEach(item => pubList.appendChild(item));
    ascending = !ascending;
    sortBtn.textContent = ascending ? 'Sort by Year ↑' : 'Sort by Year ↓';
  });
</script>

  <div class='controls'>
    <button id='sort-btn'>Sort by Year ↓</button>
  </div>

  <div class='pub-list' id='pub-list'>

<div class="pub-list" id="pub-list">
  <!--PUBLICATION_LIST-->
</div>
