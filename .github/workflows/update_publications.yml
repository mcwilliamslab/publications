name: Update Publications Page

permissions:
  contents: write

on:
  push:
    paths:
      - 'pdfs/**'
      - 'metadata.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yq for YAML parsing
        run: sudo apt-get update && sudo apt-get install -y yq

      - name: Debug YAML contents
        run: |
          echo "---- DEBUG: Printing metadata.yml ----"
          cat metadata.yml
          echo "--------------------------------------"

      - name: Build index.html from metadata.yml and template
        run: |
          template=$(cat index_template.html)
          pub_list=""

          total_items=$(yq '. | length' metadata.yml)
          echo "Processing $total_items publications from metadata.yml..."

          for i in $(seq 0 $((total_items - 1))); do
            file=$(yq -r ".[$i].file" metadata.yml)
            title=$(yq -r ".[$i].title" metadata.yml)
            author=$(yq -r ".[$i].author" metadata.yml)
            journal=$(yq -r ".[$i].journal" metadata.yml)
            year=$(yq -r ".[$i].year" metadata.yml)

            echo "Adding: $year | $title | $journal | $file"

            pub_list="${pub_list}<div class='pub-item' data-year='${year}'>
              <a href=\"pdfs/${file}\" target='_blank'>${year} — ${title}</a>
              <span class='author'>${author}</span>
              <span class='journal'>${journal}</span>
              <a class='download' href=\"pdfs/${file}\" download>(Download PDF)</a>
            </div>"
          done

          # Inject publication list into the template placeholder
          echo "${template//<!--PUBLICATION_LIST-->/$pub_list}" > index.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Rebuild publications page using template" || echo "No changes to commit"

          # Pull latest remote changes before pushing
          git pull --rebase origin main || echo "Rebase failed or not needed"

          git push origin main || echo "Push failed — likely no new changes"
